name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 03:30 UTC: the two public sites can change without a commit here.
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci
  HEAL_PROVIDER: heuristic

# Each section is its own project (sectionA/, sectionB/) with its own lockfile, jobs and report
# artifacts. The suites against public sites (A3 JSONPlaceholder; B3 emicalculator.net and
# Section B's self-healing exercise, which runs on it) run in separate jobs that may fail
# without blocking the rest: an outage or a bot wall there is not ours.
jobs:
  section:
    name: Section ${{ matrix.section }} (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            dir: sectionA
            label: LoanLens web app, SQL, self-healing
            suites: loanlens-ui sql self-healing self-healing-healed
          - section: B
            dir: sectionB
            label: LoanLens API, SQL
            suites: loanlens-api sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Exits 1 on any unexpected failure, a missing report, or a suite that ran no scenarios.
      # Section A's self-healing suite's broken locators are expected to fail with healing off.
      - run: npm test -- ${{ matrix.suites }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.dir }}-reports
          path: ${{ matrix.dir }}/reports/

  public-sites:
    name: Section ${{ matrix.section }} public site (${{ matrix.suites }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            dir: sectionA
            suites: jsonplaceholder
          - section: B
            dir: sectionB
            suites: emicalculator self-healing self-healing-healed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- ${{ matrix.suites }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.dir }}-public-site-reports
          path: ${{ matrix.dir }}/reports/

  mutation:
    name: Section ${{ matrix.section }} mutation check
    needs: section
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            dir: sectionA
          - section: B
            dir: sectionB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.dir }}-mutation
          path: ${{ matrix.dir }}/reports/mutation/
