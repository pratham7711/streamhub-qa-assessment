name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 03:30 UTC: the two public sites can change without a commit here.
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ci
  HEAL_PROVIDER: heuristic

# Each section is graded on its own, so each has its own jobs and its own report artifact.
# The suites against public sites (A3 JSONPlaceholder, B3 emicalculator.net) run in separate
# jobs that may fail without blocking the rest: an outage or a bot wall there is not ours.
jobs:
  section:
    name: Section ${{ matrix.section }} (LoanLens, SQL, self-healing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            id: a
            suites: loanlens-ui sql self-healing self-healing-healed
          - section: B
            id: b
            suites: loanlens-api sql self-healing self-healing-healed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Exits 1 on any unexpected failure, a missing report, or a suite that ran no scenarios.
      # The self-healing suite's broken locators are expected to fail with healing off.
      - run: node scripts/run-all.mjs --section ${{ matrix.id }} ${{ matrix.suites }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-${{ matrix.id }}-reports
          path: section-${{ matrix.id }}/reports/

  public-sites:
    name: Section ${{ matrix.section }} public site (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            id: a
            suite: jsonplaceholder
          - section: B
            id: b
            suite: emicalculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-all.mjs --section ${{ matrix.id }} ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-${{ matrix.id }}-${{ matrix.suite }}-reports
          path: section-${{ matrix.id }}/reports/

  mutation:
    name: Section ${{ matrix.section }} mutation check
    needs: section
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - section: A
            id: a
          - section: B
            id: b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mutation -- --section ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: section-${{ matrix.id }}-mutation
          path: section-${{ matrix.id }}/reports/mutation/
